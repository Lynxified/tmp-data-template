name: Guildera Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (user/hashtag/keyword/url/cashtag)'
        required: false
        default: ''
        type: string
      target:
        description: 'Search target'
        required: false
        default: ''
        type: string
      max_results:
        description: 'Max results'
        required: false
        default: ''
        type: string
      media_only:
        description: 'Media only (true/false)'
        required: false
        default: ''
        type: string
      raw_query:
        description: 'Advanced search raw query'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [trigger-scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci || npm install

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Build config JSON
        id: config
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Using repository_dispatch client_payload"
            SOURCE_TYPE=$(echo '${{ github.event.client_payload }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('source_type','user'))" 2>/dev/null || echo "user")
            TARGET=$(echo '${{ github.event.client_payload }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('target',''))" 2>/dev/null || echo "")
            MAX_RESULTS=$(echo '${{ github.event.client_payload }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('max_results','10'))" 2>/dev/null || echo "10")
            MEDIA_ONLY=$(echo '${{ github.event.client_payload }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('media_only','false'))" 2>/dev/null || echo "false")
            RAW_QUERY=$(echo '${{ github.event.client_payload }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('raw_query',''))" 2>/dev/null || echo "")
          elif [ -n "${{ github.event.inputs.source_type }}" ]; then
            echo "Using workflow_dispatch inputs"
            SOURCE_TYPE=$(cat <<'GHEOF'
${{ github.event.inputs.source_type }}
GHEOF
)
            TARGET=$(cat <<'GHEOF'
${{ github.event.inputs.target }}
GHEOF
)
            MAX_RESULTS=$(cat <<'GHEOF'
${{ github.event.inputs.max_results }}
GHEOF
)
            MEDIA_ONLY=$(cat <<'GHEOF'
${{ github.event.inputs.media_only }}
GHEOF
)
            RAW_QUERY=$(cat <<'GHEOF'
${{ github.event.inputs.raw_query }}
GHEOF
)
          else
            echo "Using CONFIG_JSON secret fallback"
            SOURCE_TYPE=$(echo '${{ secrets.CONFIG_JSON }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('source_type','user'))" 2>/dev/null || echo "user")
            TARGET=$(echo '${{ secrets.CONFIG_JSON }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('target',''))" 2>/dev/null || echo "")
            MAX_RESULTS=$(echo '${{ secrets.CONFIG_JSON }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('max_results','10'))" 2>/dev/null || echo "10")
            MEDIA_ONLY=$(echo '${{ secrets.CONFIG_JSON }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('media_only','false'))" 2>/dev/null || echo "false")
            RAW_QUERY=$(echo '${{ secrets.CONFIG_JSON }}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('raw_query',''))" 2>/dev/null || echo "")
          fi
          if [ "$MEDIA_ONLY" = "true" ]; then MEDIA_BOOL="true"; else MEDIA_BOOL="false"; fi
          KH="${{ secrets.KEY_HASH }}"
          CONFIG="{\"source_type\":\"${SOURCE_TYPE}\",\"target\":\"${TARGET}\",\"max_results\":\"${MAX_RESULTS}\",\"media_only\":${MEDIA_BOOL},\"key_hash\":\"${KH}\",\"raw_query\":\"${RAW_QUERY}\"}"
          echo "Config: $CONFIG"
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "source_type=$SOURCE_TYPE" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "max_results=$MAX_RESULTS" >> $GITHUB_OUTPUT
          echo "media_only=$MEDIA_ONLY" >> $GITHUB_OUTPUT
          echo "raw_query=$RAW_QUERY" >> $GITHUB_OUTPUT

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          X_STATE: ${{ secrets.X_STATE }}
          CONFIG_JSON: ${{ steps.config.outputs.config }}
          KEY_HASH: ${{ secrets.KEY_HASH }}
          SOURCE_TYPE: ${{ steps.config.outputs.source_type }}
          TARGET: ${{ steps.config.outputs.target }}
          MAX_RESULTS: ${{ steps.config.outputs.max_results }}
          MEDIA_ONLY: ${{ steps.config.outputs.media_only }}
          RAW_QUERY: ${{ steps.config.outputs.raw_query }}
        run: node scraper.js
