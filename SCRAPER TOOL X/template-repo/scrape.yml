name: Scrape Trail2Crypto
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (user/hashtag/keyword/url)'
        required: false
        default: ''
        type: string
      target:
        description: 'Search target'
        required: false
        default: ''
        type: string
      max_results:
        description: 'Max results'
        required: false
        default: ''
        type: string
      media_only:
        description: 'Media only (true/false)'
        required: false
        default: ''
        type: string
      raw_query:
        description: 'Advanced search raw query (overrides source_type/target)'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Decode auth cookies
        run: echo "$X_STATE" | base64 -d > state.json
        env:
          X_STATE: ${{ secrets.X_STATE }}
      - name: Determine scrape params
        id: params
        run: |
          if [ -n "${{ github.event.inputs.source_type }}" ]; then
            echo "SOURCE_TYPE<<GHEOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.source_type }}" >> $GITHUB_OUTPUT
            echo "GHEOF" >> $GITHUB_OUTPUT
            echo "TARGET<<GHEOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
            echo "GHEOF" >> $GITHUB_OUTPUT
            echo "MAX_RESULTS<<GHEOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.max_results }}" >> $GITHUB_OUTPUT
            echo "GHEOF" >> $GITHUB_OUTPUT
            echo "MEDIA_ONLY<<GHEOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.media_only }}" >> $GITHUB_OUTPUT
            echo "GHEOF" >> $GITHUB_OUTPUT
            echo "RAW_QUERY<<GHEOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.raw_query }}" >> $GITHUB_OUTPUT
            echo "GHEOF" >> $GITHUB_OUTPUT
            echo "ITERATIONS=1" >> $GITHUB_OUTPUT
          else
            echo "SOURCE_TYPE=user" >> $GITHUB_OUTPUT
            echo "TARGET=Trail2Crypto" >> $GITHUB_OUTPUT
            echo "MAX_RESULTS=10" >> $GITHUB_OUTPUT
            echo "MEDIA_ONLY=false" >> $GITHUB_OUTPUT
            echo "RAW_QUERY=" >> $GITHUB_OUTPUT
            echo "ITERATIONS=24" >> $GITHUB_OUTPUT
          fi
      - name: Run scraper
        run: |
          for i in $(seq 1 $ITERATIONS); do
            echo "=== Run $i of $ITERATIONS ==="
            node scraper.js
            if [ $i -lt $ITERATIONS ]; then
              echo "Sleeping 15 minutes until next run..."
              sleep 900
            fi
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCE_TYPE: ${{ steps.params.outputs.SOURCE_TYPE }}
          TARGET: ${{ steps.params.outputs.TARGET }}
          MAX_RESULTS: ${{ steps.params.outputs.MAX_RESULTS }}
          MEDIA_ONLY: ${{ steps.params.outputs.MEDIA_ONLY }}
          RAW_QUERY: ${{ steps.params.outputs.RAW_QUERY }}
          KEY_HASH: ${{ secrets.KEY_HASH }}
